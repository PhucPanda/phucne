<html lang="vi">

    <style>

            background-color: lightblue;
            font-family: 'Times New Roman', Times, serif;

        }
        h1 {
            color: blue;
            text-align: center;
            font-size: 45px;
            margin-bottom: 20px;
        }
        .menu-table {
            margin: 0 auto;

<body>

    <table class="menu-table">
        <tr>

            <td><a href="muadong.html" target="main">Mùa đông</a></td>
        </tr>
        <tr>

                <!-- Iframe trỏ đúng file muaxuan.html và tự động giãn nở -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>
    <h2>Registration Form</h2>
    <table>
        <form>
            <tr>
                <td>First Name :</td>
                <td><input type="text" placeholder="Enter First Name"></td>
            </tr>
            <tr>
                <td>Last Name :</td>
                <td><input type="text" placeholder="Enter Last Name"></td>
            </tr>
            <tr>
                <td>Email :</td>
                <td><input type="text" placeholder="Enter Email Address"></td>
            </tr>
            <tr>
                <td>Password :</td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td>
                    <label><input type="radio" name="gender">Male</label><br>
                    <label><input type="radio" name="gender">Female</label><br>
                    <label><input type="radio" name="gender">Other</label>
                </td>
            </tr>
            <tr>
                <td>Age :</td>
                <td><input type="number"></td>
            </tr>
            <tr>
                <td>Preferences :</td>
                <td>
                    <label><input type="checkbox">Acrylic Painting</label><br>
                    <label><input type="checkbox">Oil Painting</label><br>
                    <label><input type="checkbox">Water Color Painting</label>
                </td>
            </tr>
            <tr>
                <td>Select Occupation</td>
                <td>
                    <select>
                        <option>Student</option>
                        <option>Teacher</option>
                        <option>Engineer</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <textarea rows="4" cols="40" placeholder="Share few lines about yourself..."></textarea>
                </td>
            </tr>
            <tr>
                <td>Bio</td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="reset" value="RESET">
                    <input type="submit" value="SUBMIT">
                </td>
            </tr>
        </form>
    </table>
</body>

</html>
